name: Gurobean CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10','3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m compileall -q gurobean scripts
      - name: Run public HTML smoke
        run: python scripts/public_html_smoke.py
      - name: Run pytest with diagnostic capture
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short > pytest-output.txt 2>&1
          rc=$?
          cat pytest-output.txt
          echo "$rc" > pytest-exit-code.txt
          exit "$rc"
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ matrix.python-version }}
          path: |
            pytest-output.txt
            pytest-exit-code.txt
          if-no-files-found: warn
      - run: python scripts/public_contract_smoke.py
      - run: python scripts/self_audit.py
      - run: python scripts/validate_full_rounds.py
      - run: python scripts/r8_math_validation.py
      - run: python scripts/r9_end_to_end.py

  release-reference-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python scripts/public_html_smoke.py
      - run: python scripts/public_contract_smoke.py
      - run: python scripts/validate_all.py
      - run: python scripts/validate_full_rounds.py
      - run: python scripts/self_audit.py
      - run: python scripts/check_gurobi.py
        continue-on-error: true
      - name: Explain Gurobi boundary
        run: |
          echo 'CI reference validation is complete.'
          echo 'Licensed real-Gurobi certification remains a mandatory local release gate.'
          echo 'No CI fallback is allowed to represent a Gurobi PASS.'
          echo 'Production HTTP validation is performed by the Vercel deployment workflow after production deployment.'

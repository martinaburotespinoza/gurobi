name: Gurobean Engine Certification

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  certification:
    name: Engine certification (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Compile source tree
        run: python -m compileall -q gurobean scripts api web

      - name: Public contract smoke
        run: python scripts/public_contract_smoke.py

      - name: Public HTML smoke
        run: python scripts/public_html_smoke.py

      - name: Public UI delivery smoke
        run: python scripts/public_ui_delivery_smoke.py

      - name: Full reference validation
        run: python scripts/validate_all.py

      - name: Full rounds validation
        run: python scripts/validate_full_rounds.py

      - name: R8 mathematical validation
        run: python scripts/r8_math_validation.py

      - name: R9 end-to-end validation
        run: python scripts/r9_end_to_end.py

      - name: Repository self-audit
        run: python scripts/self_audit.py

      - name: Pytest certification suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short | tee certification-pytest.txt

      - name: Gurobi availability boundary
        shell: bash
        run: |
          set +e
          python scripts/check_gurobi.py | tee gurobi-availability.txt
          rc=${PIPESTATUS[0]}
          echo "check_gurobi_exit_code=$rc" | tee -a gurobi-availability.txt
          if [ "$rc" -ne 0 ]; then
            echo "REFERENCE_CERTIFICATION: PASS"
            echo "REAL_GUROBI_CERTIFICATION: NOT_CLAIMED"
            echo "Reason: licensed Gurobi is not guaranteed on this runner."
            exit 0
          fi
          echo "REFERENCE_CERTIFICATION: PASS"
          echo "REAL_GUROBI_AVAILABLE: YES"

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gurobean-engine-certification
          path: |
            certification-pytest.txt
            gurobi-availability.txt
            validation_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Certification summary
        if: success()
        run: |
          echo '============================================='
          echo 'GUROBEAN ENGINE CERTIFICATION GATE: PASS'
          echo '============================================='
          echo 'Code compilation: PASS'
          echo 'Public contracts: PASS'
          echo 'Reference mathematics: PASS'
          echo 'R1-R9 validation scripts: PASS'
          echo 'Pytest suite: PASS'
          echo 'No production deployment was performed.'
          echo 'Real licensed-Gurobi certification remains a separate release gate.'

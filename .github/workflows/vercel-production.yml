name: Vercel Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GUROBEAN_CANONICAL_URL: https://gurobi-phi.vercel.app
      GUROBEAN_CANONICAL_HOST: gurobi-phi.vercel.app
      GUROBEAN_VERCEL_PROJECT: gurobi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify Vercel token is available
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not available to this workflow."
            exit 1
          fi
          echo "VERCEL_TOKEN is available to the deployment job."
      - name: Link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --yes --project "$GUROBEAN_VERCEL_PROJECT" --token "$VERCEL_TOKEN"
      - name: Deploy production and attach canonical alias
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prod --yes --project "$GUROBEAN_VERCEL_PROJECT" --token "$VERCEL_TOKEN" 2>&1 | tee vercel-deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' vercel-deploy.log | tail -1 || true)
          if [ -z "$URL" ]; then
            echo "Could not determine the production deployment URL."
            cat vercel-deploy.log
            exit 1
          fi
          echo "GUROBEAN_PRODUCTION_URL=$URL" >> "$GITHUB_ENV"
          echo "Production deployment URL: $URL"
          echo "Attaching canonical alias: $GUROBEAN_CANONICAL_HOST"
          npx --yes vercel@latest alias set "$URL" "$GUROBEAN_CANONICAL_HOST" --token "$VERCEL_TOKEN"
          echo "CANONICAL_ALIAS_ATTACHED: PASS"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install production validation dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate deployed production
        env:
          VERCEL_PROTECTED_CI: "1"
        run: python scripts/validate_production.py
      - name: Validate canonical public alias
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking canonical production alias: $GUROBEAN_CANONICAL_URL"
          npx --yes vercel@latest curl "$GUROBEAN_CANONICAL_URL/api/health" > canonical-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("canonical-health.json").read_text(encoding="utf-8"))
          assert payload.get("status") == "ok", payload
          assert payload.get("service") == "gurobean-engine", payload
          print("CANONICAL_ALIAS_HEALTH: PASS")
          PY
      - name: Validate canonical UI delivery marker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest curl "$GUROBEAN_CANONICAL_URL/" > canonical-ui.html
          python - <<'PY'
          from pathlib import Path
          html = Path("canonical-ui.html").read_text(encoding="utf-8", errors="replace")
          required = ["gurobean-readable-ui", "gurobean-premium-visual", "gurobean-visual-patch", "☕", "🧊", "🏆", "Decision Cockpit"]
          missing = [marker for marker in required if marker not in html]
          if missing:
              raise SystemExit(f"CANONICAL_UI_MARKER_FAILURE: {missing}")
          print("CANONICAL_UI_DELIVERY: PASS")
          PY
      - name: Upload production validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gurobean-production-validation
          path: |
            validation_report.json
            vercel-deploy.log
            canonical-health.json
            canonical-ui.html
          if-no-files-found: warn
          retention-days: 30

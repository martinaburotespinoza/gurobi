name: Vercel Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Vercel token is available
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not available to this workflow."
            exit 1
          fi
          echo "VERCEL_TOKEN is available to the deployment job."
      - name: Deploy production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --name gurobean-engine-v2-6 2>&1 | tee vercel-deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' vercel-deploy.log | tail -1 || true)
          if [ -z "$URL" ]; then
            echo "Could not determine the production deployment URL."
            cat vercel-deploy.log
            exit 1
          fi
          echo "GUROBEAN_PRODUCTION_URL=$URL" >> "$GITHUB_ENV"
          echo "Production deployment URL: $URL"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production validation dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate deployed production
        run: python scripts/validate_production.py

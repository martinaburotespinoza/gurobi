name: Vercel Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_SX9pUgbdxVl9MoaMMoTVDbue
      VERCEL_PROJECT_ID: prj_97BMIoW2FZ7QO9OBxaqDybkMqall
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Vercel token is available
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not available to this workflow."
            exit 1
          fi
          echo "VERCEL_TOKEN is available to the deployment job."
      - name: Deploy production
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production validation dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate deployed production
        run: python scripts/validate_production.py

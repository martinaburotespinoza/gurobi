name: Vercel Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify Vercel token is available
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not available to this workflow."
            exit 1
          fi
          echo "VERCEL_TOKEN is available to the deployment job."
      - name: Deploy production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee vercel-deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' vercel-deploy.log | tail -1 || true)
          if [ -z "$URL" ]; then
            echo "Could not determine the production deployment URL."
            cat vercel-deploy.log
            exit 1
          fi
          echo "GUROBEAN_PRODUCTION_URL=$URL" >> "$GITHUB_ENV"
          echo "Production deployment URL: $URL"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install production validation dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate deployed production
        env:
          VERCEL_PROTECTED_CI: "1"
        run: python scripts/validate_production.py
      - name: Upload production validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gurobean-production-validation
          path: |
            validation_report.json
            vercel-deploy.log
          if-no-files-found: warn
          retention-days: 30

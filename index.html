<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gurobean Engine v2_6</title>
  <style>body{font-family:system-ui,sans-serif;background:#f7f4ed;color:#173b68;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:720px;margin:24px;padding:32px;background:white;border:1px solid #dfe6ed;border-radius:24px;box-shadow:0 18px 50px #2a415b18}h1{margin:0 0 8px}p{color:#718198;line-height:1.5}.status{padding:12px;border-radius:12px;background:#f4f7f9;margin:20px 0}.ok{color:#24765a}.bad{color:#a43d45}a,button{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:#173b68;color:white;text-decoration:none;font-weight:800;margin:4px;cursor:pointer}.secondary{background:#edf5fa;color:#38526e}</style>
</head>
<body>
<main class="card">
<h1>☕ Gurobean Engine <small>v2_6</small></h1>
<p>Motor de optimización matemática, simulación y evaluación reproducible.</p>
<div id="status" class="status">Conectando con el motor…</div>
<a href="/app">Abrir consola completa</a>
<a class="secondary" href="/capture">Capturar juego R1–R8</a>
<div><button onclick="test(1)">Probar R1</button><button onclick="test(8)">Probar R8</button></div>
<pre id="out"></pre>
<script>
const s=document.getElementById('status'),o=document.getElementById('out');
async function health(){try{const r=await fetch('/api/health',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.detail||r.status);s.textContent='✓ Motor conectado · API operativa';s.className='status ok';return true}catch(e){s.textContent='✗ API no disponible: '+e.message;s.className='status bad';return false}}
async function test(round){o.textContent='Ejecutando R'+round+'…';const scenario={lambda_total:15,p_hot:1,p_cold:0,revenue_hot:4,revenue_cold:4,cost_hot:1,cost_cold:1,salvage_hot:0,salvage_cold:0,beans_available:100,water_available:100,beans_hot:1,beans_cold:1,water_hot:1,water_cold:1};const body={round_number:round,backend:round<=4?'scipy':'simulation',scenario};try{const r=await fetch('/api/solve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.detail||r.status);o.textContent=JSON.stringify(d,null,2)}catch(e){o.textContent='ERROR: '+e.message}}
health();
</script>
</main>
</body></html>

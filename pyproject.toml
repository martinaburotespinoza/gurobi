[project]
name = "gurobean-engine"
version = "0.3.0"
description = "Auditable mathematical and simulation engine for Gurobean Coffee"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.128,<1",
    "pydantic>=2.0,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
gurobi = ["gurobipy>=12"]
test = ["pytest>=8", "fastapi>=0.128,<1", "httpx>=0.27"]
api = ["fastapi>=0.128,<1", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["gurobean*", "api*"]
